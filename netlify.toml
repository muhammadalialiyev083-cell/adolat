[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Existing public/_redirects retains the actual backend destination.
# /api/* must precede the SPA fallback.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
